name: Release

on:
  push:
    tags:
      - v*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'

    - name: Cache node modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-cache-${{ hashFiles('**/yarn.lock') }}

    - name: Install dependencies
      run: yarn --frozen-lockfile

    - name: Run tests
      run: |
        yarn lint
        yarn test

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup Node.js to publish to npm
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://registry.npmjs.com'

    - name: Cache node modules
      uses: actions/cache@v6
      with:
        path: node_modules
        key: ${{ runner.os }}-cache-${{ hashFiles('**/yarn.lock') }}

    - name: Install dependencies
      run: yarn --frozen-lockfile

    - name: Get package version
      id: package-version
      run: echo "current-version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

    - name: Get changelog
      id: changelog
      uses: mindsers/changelog-reader-action@1faaf50aa09d5793d9a100819973df801febfb31 # v2
      with:
        version: ${{ steps.package-version.outputs.current-version }}

    - name: Publish npm package
      run: yarn publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Setup Node.js to publish to GitHub Packages
      uses: actions/setup-node@v7
      with:
        node-version-file: '.nvmrc'
        registry-url: 'https://npm.pkg.github.com'
        scope: '@smartbear'

    - name: Create GitHub release
      uses: actions/create-release@v1.1.4
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: v${{ steps.package-version.outputs.current-version }}
        release_name: Release ${{ steps.package-version.outputs.current-version }}
        body: ${{ steps.changelog.outputs.changes }}

    - name: Publish GitHub package
      run: yarn publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
